[project]
name = "hand-gesture-recognition"
version = "0.0.0"
description = "Viam vision service that recognizes hand gestures as detections"
requires-python = ">=3.12"

dependencies = [
    # MediaPipe is pinned exactly; uv.lock pins the rest of the tree.
    #
    # 1.1.1 is the first release usable on every target: the 1.x line is the first
    # with py3-none linux/aarch64 wheels that coexist with viam-sdk (0.10.18's
    # aarch64 wheel needs protobuf<5; viam-sdk pins protobuf 6), and the 1.0.x
    # macOS arm64 Metal abort (DrishtiMetalHelper, graph_service.h:139) is fixed.
    #
    # 1.x embeds Google's "clearcut" usage telemetry with no opt-out
    # (google-ai-edge/mediapipe#6291). That is accepted deliberately: it is silent,
    # needs no interaction, and recognition is unaffected when uploads are blocked.
    "mediapipe==1.1.1",
    "numpy",
    "viam-sdk",
    "typing-extensions",
]

# Exact versions for the whole tree, including transitives, live in uv.lock.
# Declare intent here; let the lock pin reality.
[dependency-groups]
dev = [
    "pyinstaller",
    "pytest",
    "ruff",
]

[tool.uv]
# An application, not a library — there is nothing here to build or install.
package = false

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests", "."]

[tool.ruff.lint]
# UP (pyupgrade) is deliberately not selected: `Optional[X]` reads fine, and
# rewriting to `X | None` would churn every signature for no functional gain.
select = ["E", "F", "I", "B"]
ignore = [
    "E501",  # line length is handled by the formatter, not enforced
    "B008",  # false positives on dataclass field() defaults
]

[tool.ruff.lint.isort]
# src/ is this project's own package, not a third-party dependency.
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
